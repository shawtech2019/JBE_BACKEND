<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title><%- subject %></title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f5f7;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
    <!-- Inbox preview text -->
    <span style="display:none!important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;overflow:hidden;mso-hide:all;">
      <%- previewText %>
    </span>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;">
      <tr>
        <td align="center" style="padding:32px 12px;">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(15,23,42,0.08);">
            <!-- Header -->
            <tr>
              <td style="background-color:#1a3a5f;padding:26px 32px;">
                <span style="display:inline-block;color:#ffffff;font-size:18px;font-weight:700;letter-spacing:0.3px;">
                  <%- appName %>
                </span>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:36px 32px;color:#1f2937;font-size:15px;line-height:1.65;">
                <%= content %>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding:22px 32px;background-color:#f9fafb;border-top:1px solid #eef0f3;color:#94a3b8;font-size:12px;line-height:1.6;">
                <p style="margin:0 0 6px;">
                  This is an automated message from <%- appName %>. Please do not reply to this email.
                </p>
                <p style="margin:0;">
                  &copy; <%- year %> <%- appName %>. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
