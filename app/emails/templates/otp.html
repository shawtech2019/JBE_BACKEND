<p style="margin:0 0 16px;font-size:16px;color:#111827;">
  Hi <%- firstName || "there" %>,
</p>

<p style="margin:0 0 22px;">
  <%- intro %>
</p>

<!-- OTP code -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto 22px;">
  <tr>
    <td align="center" style="background-color:#f1f5f9;border:1px dashed #cbd5e1;border-radius:12px;padding:18px 34px;">
      <span style="display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#64748b;margin-bottom:6px;">
        Your code
      </span>
      <span style="display:block;font-size:34px;font-weight:700;letter-spacing:8px;color:#1a3a5f;">
        <%- otp %>
      </span>
    </td>
  </tr>
</table>

<p style="margin:0 0 20px;text-align:center;color:#475569;font-size:14px;">
  This code expires in <strong><%- expiresInMinutes %> minutes</strong>.
</p>

<p style="margin:0;color:#64748b;font-size:13px;">
  If you didn't <%- ignoreText %>, you can safely ignore this email — no changes will be made.
</p>
